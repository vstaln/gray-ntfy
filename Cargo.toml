[package]
name = "gray-ntfy"
version = "0.1.2"
edition = "2021"
rust-version = "1.89"
license = "MIT"
description = "Standalone ntfy transport and setup for gray"

[lib]
name = "gray_ntfy"
path = "src/lib.rs"

[[bin]]
name = "gray-ntfy"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
